<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="../"><link rel="icon" href="data:,"><title>Stage 2.1 · Gate and CALL audio regression</title><script src="assets/vendor/Tone.js"></script><script src="loop-engine.js"></script><script src="audio.js"></script></head><body><h1>Stage 2.1 · Real Tone.js gate and transient measurements</h1><button id="run">Run targeted audio checks</button><pre id="results">Isolated test fixtures; no test phrase is loaded by the instrument.</pre><script>
'use strict';
const out=document.querySelector('#results'),{Recorder,PPQ,BAR}=RingtoneLoops;
let count=0;window.measurements=[];
const rms=(data,from=0,to=data.length)=>{let sum=0;for(let i=from;i<to;i++)sum+=data[i]**2;return Math.sqrt(sum/Math.max(1,to-from));};
function check(ok,text){if(!ok)throw Error(text);count++;out.textContent+=`PASS ${text}\n`;}
function envelope(data,sr=44100){const width=Math.round(.02*sr),hop=Math.round(.01*sr),values=[];for(let i=0;i+width<=data.length;i+=hop)values.push(rms(data,i,i+width));return values;}
function attacks(data,sr=44100){const env=envelope(data,sr),threshold=Math.max(...env)*.08;let active=false,n=0;for(const v of env){if(v>threshold&&!active){active=true;n++;}else if(v<threshold*.8)active=false;}return n;}
async function run(){
 document.querySelector('#run').disabled=true;out.textContent='';count=0;const buffers=await RingtoneAudio.loadBuffers();let old;let references=[];
 async function render(play,signal=0,seconds=2.2){let graph;try{const b=await Tone.Offline(()=>{graph=RingtoneAudio.createGraph(buffers);graph.signal(signal,.001);play(graph);},seconds,1,44100);return b.get().getChannelData(0).slice();}finally{graph?.dispose();references.forEach(s=>s.dispose());references=[];}}
 function referenceNote(g,note,duration,time){const synth=new Tone.Synth({volume:-22,oscillator:{type:'square'},envelope:{attack:.006,decay:.14,sustain:.35,release:.09}}).connect(g.busA);references.push(synth);synth.triggerAttack(note,time,.72);synth.triggerRelease(time+duration);}
 function relativeError(a,b){let sum=0;for(let i=0;i<a.length;i++)sum+=(a[i]-b[i])**2;return Math.sqrt(sum/a.length)/Math.max(1e-12,rms(b));}
 try{
  for(const grid of ['off','4n','8n','16n'])for(const ms of [150,300,500,1000,1500]){
   const r=new Recorder();r.grid=grid;r.begin(0,0);r.down(0,'C4','a',43.7);r.up('a',43.7+ms/1000/.625*PPQ);r.finish(44+ms/1000/.625*PPQ);
   const gate=r.tracks[0].events[0].duration/PPQ*.625;
   const actual=await render(g=>g.playLoopNote('C4',gate,.1));
   // Reference is an explicit live note-on/note-off, NOT another quantized event.
   const reference=await render(g=>referenceNote(g,'C4',ms/1000,.1));
   const error=relativeError(actual,reference);
   measurements.push({grid,requestedMs:ms,storedMs:gate*1000,waveformRelativeError:error});
   check(Math.abs(gate-ms/1000)<1e-8&&error<.0001,`${grid}: ${ms} ms loop audio matches independent known-length gate (wave error ${error.toExponential(2)})`);
   check(rms(actual,Math.round((.1+gate+.22)*44100))<.00001,`${grid}: ${ms} ms releases to silence; release does not extend the recorded gate`);
  }
  const mixed=await render(g=>{g.playLoopNote('C4',.15,.1);g.playLoopNote('Eb4',.5,.2);g.playLoopNote('G4',1.5,.3);},0,2.2);
  check(rms(mixed,40000,60000)>.0001&&rms(mixed,90000)<.00001,'mixed 150/500/1500 ms overlapping chord gates hold and release independently');
  const repeats=await render(g=>{g.playLoopNote('C4',.09,.1);g.playLoopNote('C4',.15,.32);g.playLoopNote('C4',.5,.6);});
  check(rms(repeats,Math.round(.65*44100),Math.round(.95*44100))>.0001&&rms(repeats,Math.round(1.35*44100))<.00001,'rapid same-pitch retriggers have independent finite envelopes');
  const seam=await render(g=>g.playLoopNote('C4',.390625,2.1875),0,3.0);
  const seamRef=await render(g=>referenceNote(g,'C4',.390625,2.1875),0,3.0);
  check(relativeError(seam,seamRef)<.0001&&rms(seam,Math.round(2.52*44100),Math.round(2.56*44100))>.0001,'note crossing the 2.5-second loop seam retains the full gate in actual audio');
  const carryOverlap=await render(g=>{g.playLoopNote('C4',.6,.1);g.playLoopNote('C4',.5,.3);});
  check(rms(carryOverlap,Math.round(.72*44100),Math.round(.77*44100))>.0001,'next same-pitch envelope cannot cut off a carried note early');
  old=await new Promise((resolve,reject)=>{const b=new Tone.ToneAudioBuffer('tests/fixtures/call-stage2-before.wav',()=>resolve(b),reject);});
  const original=old.get().getChannelData(0),source=buffers[0].get().getChannelData(0),oldSR=old.sampleRate,sourceSR=buffers[0].sampleRate;
  check(attacks(original,oldSR)===2,'baseline CALL WAV has two separated attacks, confirming source defect');
  check(rms(original,Math.round(.30*oldSR),Math.round(.38*oldSR))===0,'baseline has a silent 300–380 ms gap before its second attack');
  check(attacks(source,sourceSR)===1,'replacement CALL WAV has one significant attack, not two separated bursts');
  check(source.length/sourceSR===.8&&rms(source,Math.round(.6*sourceSR),Math.round(.7*sourceSR))>.0001,'CALL keeps an 800 ms natural decay, not an artificially short click');
  const rawRatio=rms(source,Math.round(.4*sourceSR),Math.round(.5*sourceSR))/rms(source,Math.round(.04*sourceSR),Math.round(.09*sourceSR));
  check(rawRatio>.02&&rawRatio<.25,`CALL envelope decays smoothly after its attack (late/early RMS ${rawRatio.toFixed(3)})`);
  for(const signal of [0,.5,1]){
   const call=await render(g=>g.playPad(0,.1),signal,1.3);const n=attacks(call);
   measurements.push({kind:'CALL',signal,attacks:n,peak:call.reduce((m,x)=>Math.max(m,Math.abs(x)),0)});
   check(n===1,`one CALL trigger renders one audible attack with SIGNAL ${signal}`);
   check(rms(call,44100)<.00001,`CALL with SIGNAL ${signal} has no delayed repeat or feedback tail`);
  }
  for(const signal of [0,1]){
   const callLoops=await render(g=>{for(const t of [.1,2.6,5.1])g.playPad(0,t,true);},signal,6.3);
   check(attacks(callLoops)===3,`three recorded CALL events render exactly three attacks with SIGNAL ${signal}`);
  }
  for(let pad=1;pad<3;pad++){
   const data=await render(g=>g.playPad(pad,.1));check(rms(data)>.0001&&rms(data,44100)<.00001,`${['CALL','PING','CLICK'][pad]} remains audible and releases normally`);
  }
  out.textContent+=`\n${count} targeted real-audio checks passed\n`+JSON.stringify(measurements,null,2);document.body.dataset.result='pass';
 }catch(e){out.textContent+='FAIL '+e.stack;document.body.dataset.result='fail';console.error(e);}finally{buffers.forEach(b=>b.dispose());old?.dispose();}
}
document.querySelector('#run').onclick=run;
</script></body></html>
